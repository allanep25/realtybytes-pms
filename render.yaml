# Render Blueprint — https://render.com
# Alternative to Railway. Import this file when creating a new Blueprint.

services:
  - type: web
    name: amar-residence
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: amar-residence-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: Amar Residence

databases:
  - name: amar-residence-db
    plan: starter
    databaseName: amar_residence
    user: amar
