# Render Blueprint — https://render.com
# Alternative to Railway. Import this file when creating a new Blueprint.

services:
  - type: web
    name: realtybytes-pms
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: realtybytes-pms-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: RealtyBytes

databases:
  - name: realtybytes-pms-db
    plan: starter
    databaseName: realtybytes_pms
    user: realtybytes
